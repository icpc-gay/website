<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ICPC.GAY</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="navbar">
    <a href="/" class="logo">
        ICPC<span>.GAY</span>
    </a>

    <div class="nav-right">
        <button class="language-button" id="languageButton">
            <span id="languageText">English</span>
            <span class="arrow"></span>
        </button>

        <div class="language-menu" id="languageMenu">
            <button data-language="zh">中文</button>
            <button data-language="en">English</button>
        </div>
    </div>
</header>


<main class="hero">

    <div class="hero-content">

        <p class="eyebrow" data-i18n="eyebrow">
            INTERNATIONAL COLLEGIATE PROGRAMMING CONTEST
        </p>

        <h1 data-i18n="title">
            ICPC.GAY
        </h1>

        <p class="subtitle" data-i18n="subtitle">
            Code. Compete. Create.
        </p>

        <p class="description" data-i18n="description">
            A place for programmers, problem solvers,
            and everyone who enjoys competitive programming.
        </p>

        <div class="buttons">
            <a href="#" class="button primary" data-i18n="button1">
                Explore
            </a>

            <a href="#" class="button secondary" data-i18n="button2">
                About
            </a>
        </div>

    </div>

</main>


<footer class="footer">
    <span>&copy; 2026 vlouboos. All rights reserved.</span>
</footer>


<script src="script.js"></script>

</body>
</html>
